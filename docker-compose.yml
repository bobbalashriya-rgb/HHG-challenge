services:
  db:
    image: postgres:16-alpine
    container_name: finolitics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finolitics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Web-based lightweight UI for Postgres (zero-login, instant view at http://localhost:8081)
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: finolitics_pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/finolitics?sslmode=disable
    depends_on:
      - db

  # Full-featured pgAdmin 4 UI (accessible at http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finolitics_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
